function lzMarket(host){const P=PAL();const CC={kr:'KR',us:'US',jp:'JP'};
 const at=(arr,d)=>{if(!arr||!arr.length)return null;let r=null;for(const x of arr){if(x.d<=d)r=x}return r};
 const back=(arr,days)=>{if(!arr||!arr.length)return null;const L=arr[arr.length-1];const t=new Date(L.d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()-days);return at(arr,t.toISOString().slice(0,10))};
 const dv=(a,b,k)=>a&&b&&a!==b&&a[k]!=null&&b[k]!=null?a[k]-b[k]:null;
 host.innerHTML=(D.lz_mkt||[]).map((m,i)=>`<div class="card"><h2>${m.label} · 양마켓 다운로드·평점 추이</h2>

  <div id="lzt${i}" style="margin-top:10px"></div></div>`).join('');
 (D.lz_mkt||[]).forEach((m,i)=>{

   options:{scales:{x:{},y:{ticks:{precision:0,callback:v=>nf(v)}},y1:{position:'right',grid:{drawOnChartArea:false},ticks:{precision:0,callback:v=>nf(v)}}}}});
  const rs=[{label:'구글플레이',arr:m.play}].concat(Object.entries(m.ios).map(([k,a])=>({label:'앱스토어 '+CC[k],arr:a})));
  chart('lzr'+i,{type:'line',data:{labels:lab,datasets:rs.map((s,j)=>{const mm=Object.fromEntries(s.arr.map(x=>[x.d,x.rating]));return{label:s.label,data:days.map(d=>mm[d]??null),borderColor:P[j],backgroundColor:P[j],pointRadius:3,tension:.2,spanGaps:true}})},
   options:{scales:{x:{},y:{suggestedMin:1,suggestedMax:5,ticks:{callback:v=>nf(v,1)}}}}});
  const L=m.play[m.play.length-1],P1=back(m.play,1);
  const k=[];if(L){const di=dv(L,P1,'inst');k.push(['구글플레이 누적 설치',nf(L.inst),di!=null?`전일 대비 <b class="${cls(di)}">${sg(di)}</b>`:'전일 비교는 2일차부터'],['구글플레이 평점',nf(L.rating,2),`평점 수 ${nf(L.rc)}`])}
  Object.entries(m.ios).forEach(([c,a])=>{const x=a[a.length-1];k.push([`앱스토어 ${CC[c]} 평점`,nf(x.rating,2),`평점 수 ${nf(x.rc)}`])});
  $('#lzk'+i).innerHTML=k.map(([l,v,s])=>`<div class="kpi" style="cursor:default"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  const rows=rs.map(s=>{const a=s.arr,x=a[a.length-1],d1=back(a,1),d7=back(a,7),f=a[0];
