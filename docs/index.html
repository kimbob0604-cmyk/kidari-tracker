function table(el,cols,rows,init){let st=Object.assign({k:null,dir:'desc'},init||{});
  function draw(){let r=rows.slice();if(st.k){const c=cols.find(c=>c.k==st.k);r.sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;if(typeof x=='string')return st.dir=='asc'?x.localeCompare(y):y.localeCompare(x);return st.dir=='asc'?x-y:y-x})}
    el.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''} ${st.k==c.k?'on':''}" data-k="${c.k}" data-dir="${st.dir}">${c.l}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''} ${c.cl?c.cl(x[c.k]):''}">${c.f?c.f(x[c.k],x):esc(x[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.k==k)st.dir=st.dir=='desc'?'asc':'desc';else{st.k=k;st.dir='desc'}draw()})}
  draw()}

function cardView(host,opt){const st={k:opt.sorts[0][0],dir:opt.sorts[0][2]||'desc',view:'card',q:''};
  host.innerHTML=`<div class="bar"><span class="lbl">정렬</span><div class="seg" data-r="sort">${opt.sorts.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('')}</div>
   <button class="dir" data-r="dir"></button><div class="seg" data-r="view"><button data-v="card">카드</button><button data-v="table">표</button></div>
   ${opt.filters?`<div class="seg" data-r="flt">${opt.filters.map(f=>`<button data-f="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}
   <span class="muted" data-r="cnt" style="margin-left:auto"></span></div><div data-r="body"></div>`;
  const q=s=>host.querySelector(`[data-r="${s}"]`);let flt=null;
  function draw(){let r=opt.rows.filter(x=>!flt||x.genre==flt||String(x.genre||'').includes(flt));
    r.sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;return st.dir=='asc'?x-y:y-x});
    q('sort').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k==st.k));
    q('view').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==st.view));
    if(q('flt'))q('flt').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f==flt));
    q('dir').textContent=st.dir=='desc'?'내림차순 ▼':'오름차순 ▲';q('cnt').textContent=r.length+'개';
    const body=q('body');
    if(st.view=='card')body.innerHTML=`<div class="grid">${r.map(opt.card).join('')}</div>`;
    else table(body,opt.cols,r,{k:st.k,dir:st.dir})}
  q('sort').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(st.k==b.dataset.k)st.dir=st.dir=='desc'?'asc':'desc';else{st.k=b.dataset.k;st.dir=(opt.sorts.find(s=>s[0]==st.k)[2])||'desc'}draw()});
  q('dir').onclick=()=>{st.dir=st.dir=='desc'?'asc':'desc';draw()};
  q('view').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;draw()});
  if(q('flt'))q('flt').querySelectorAll('button').forEach(b=>b.onclick=()=>{flt=flt==b.dataset.f?null:b.dataset.f;draw()});
  draw()}
