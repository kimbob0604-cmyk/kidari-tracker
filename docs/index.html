function table(el,cols,rows,init){let st=Object.assign({k:null,dir:'desc'},init||{});
  function draw(){let r=rows.slice();if(st.k){const c=cols.find(c=>c.k==st.k);r.sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;if(typeof x=='string')return st.dir=='asc'?x.localeCompare(y):y.localeCompare(x);return st.dir=='asc'?x-y:y-x})}
    el.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''} ${st.k==c.k?'on':''}" data-k="${c.k}" data-dir="${st.dir}">${c.l}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''} ${c.cl?c.cl(x[c.k]):''}">${c.f?c.f(x[c.k],x):esc(x[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.k==k)st.dir=st.dir=='desc'?'asc':'desc';else{st.k=k;st.dir='desc'}draw()})}
  draw()}

function cardView(host,opt){const st={k:opt.sorts[0][0],dir:opt.sorts[0][2]||'desc',view:'card',q:''};
  host.innerHTML=`<div class="bar"><span class="lbl">정렬</span><div class="seg" data-r="sort">${opt.sorts.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('')}</div>
   <button class="dir" data-r="dir"></button><div class="seg" data-r="view"><button data-v="card">카드</button><button data-v="table">표</button></div>
   ${opt.filters?`<div class="seg" data-r="flt">${opt.filters.map(f=>`<button data-f="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}
   <span class="muted" data-r="cnt" style="margin-left:auto"></span></div><div data-r="body"></div>`;
  const q=s=>host.querySelector(`[data-r="${s}"]`);let flt=null;
  function draw(){let r=opt.rows.filter(x=>!flt||x.genre==flt||String(x.genre||'').includes(flt));
    r.sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;return st.dir=='asc'?x-y:y-x});
    q('sort').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k==st.k));
    q('view').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==st.view));
    if(q('flt'))q('flt').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f==flt));
    q('dir').textContent=st.dir=='desc'?'내림차순 ▼':'오름차순 ▲';q('cnt').textContent=r.length+'개';
    const body=q('body');
    if(st.view=='card')body.innerHTML=`<div class="grid">${r.map(opt.card).join('')}</div>`;
    else table(body,opt.cols,r,{k:st.k,dir:st.dir})}
  q('sort').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(st.k==b.dataset.k)st.dir=st.dir=='desc'?'asc':'desc';else{st.k=b.dataset.k;st.dir=(opt.sorts.find(s=>s[0]==st.k)[2])||'desc'}draw()});
  q('dir').onclick=()=>{st.dir=st.dir=='desc'?'asc':'desc';draw()};
  q('view').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;draw()});
  if(q('flt'))q('flt').querySelectorAll('button').forEach(b=>b.onclick=()=>{flt=flt==b.dataset.f?null:b.dataset.f;draw()});
  draw()}

RENDER.calc=()=>{const h=$('#p-calc');
 const DEF={daily:Math.round(tz.basis),core_rev:2636,core_op:218,kr_webtoon:1204,shares:35646926,per:12,tax:30,price:D.price.c[D.price.c.length-1],
  cases:{Bear:{mult:2,won:50,paid:30,recog:44,opm:-20,pen:3},Base:{mult:8.2,won:50,paid:60,recog:44,opm:18,pen:8},Bull:{mult:20,won:50,paid:100,recog:44,opm:25,pen:22}}};
 let S;try{S=JSON.parse(localStorage.getItem('kd_calc2'))}catch(e){} if(!S||!S.cases)S=JSON.parse(JSON.stringify(DEF));
 const ROWS=[['mult','A · 하루 메시지 배수(현재 대비)','탑코 1Q26→2Q26 챗 매출 ×8.2'],['won','A · 메시지당 과금(원)','탐방: 턴당 40→50원'],['paid','A · 유료 메시지 비중(%)','무료 턴 제외'],['recog','키다리 인식 비율(%)','작가 RS 후 파트너 50:50 → 100당 43~45'],['opm','티즈 영업이익률(%)','토큰비 파트너 부담. 회사 Base 30/165=18%'],['pen','B · 국내 웹툰 대비 챗 매출(%)','탑코 2Q26 22%']];
 h.innerHTML=`<div class="page-head"><h1>티즈 기여도 계산기 · 탑코 케이스</h1><p>숫자를 바꾸면 바로 다시 계산. 방법 A = 트래커 실측 하루 메시지에서 출발, 방법 B = 탑툰챗처럼 국내 웹툰 매출의 일정 비율까지 챗이 붙는 경우. 분모는 2027E 본업(티즈 제외)</p></div>

 <div class="tw"><table class="ct"><thead><tr><th>케이스 입력</th><th class="n">Bear</th><th class="n">Base</th><th class="n">Bull</th><th>근거</th></tr></thead><tbody id="cin"></tbody></table></div><button class="dir" id="creset" style="margin-top:8px">기본값으로</button></div>

 function build(){h.querySelectorAll('[data-g]').forEach(el=>{el.value=S[el.dataset.g];el.oninput=()=>{S[el.dataset.g]=+el.value;save();calc()}});
  $('#cin').innerHTML=ROWS.map(([k,l,d])=>`<tr><td>${l}</td>${['Bear','Base','Bull'].map(c=>`<td class="n"><input type="number" step="any" data-c="${c}" data-k="${k}" value="${S.cases[c][k]}"></td>`).join('')}<td class="d">${d}</td></tr>`).join('');
  $('#cin').querySelectorAll('input').forEach(el=>el.oninput=()=>{S.cases[el.dataset.c][el.dataset.k]=+el.value;save();calc()});calc()}
 function calc(){const R={};['Bear','Base','Bull'].forEach(c=>{const p=S.cases[c],r={};

  r.needB=r.revB*1e8/(365*p.won*p.paid/100*p.recog/100);r.xB=r.needB/S.daily;R[c]=r});
  const rows=[['A · 2027 하루 메시지','mA',v=>nf(v)],['A · 티즈 매출','revA',v=>nf(v,1)],['A · 티즈 영업이익','opA',v=>nf(v,1)],['A · 매출 기여도','rsA',v=>nf(v,1)+'%'],['A · 영업이익 기여도','osA',v=>nf(v,1)+'%'],['A · 주당가치 기여(원)','psA',v=>nf(v)],
   ['B · 티즈 매출','revB',v=>nf(v,1)],['B · 티즈 영업이익','opB',v=>nf(v,1)],['B · 매출 기여도','rsB',v=>nf(v,1)+'%'],['B · 영업이익 기여도','osB',v=>nf(v,1)+'%'],['B · 주당가치 기여(원)','psB',v=>nf(v)],['B가 요구하는 하루 메시지','needB',v=>nf(v)],['B 요구치 ÷ 현재','xB',v=>nf(v,1)+'배']];
  $('#cout').innerHTML=rows.map(([l,k,f])=>`<tr><td>${l}</td>${['Bear','Base','Bull'].map(c=>`<td class="n">${f(R[c][k])}</td>`).join('')}</tr>`).join('');
  $('#cnote').textContent=`주당가치 기여 = 티즈 영업이익 × (1−세율) × PER ÷ 유통주식. 현재 주가 ${nf(S.price)}원 대비 Base A ${nf(R.Base.psA/S.price*100,1)}%, Base B ${nf(R.Base.psB/S.price*100,1)}%`;
  const P=PAL(),cs=['Bear','Base','Bull'];
  chart('cc1',{type:'bar',data:{labels:cs,datasets:[{label:'A 매출 기여',data:cs.map(c=>R[c].rsA),backgroundColor:P[0]+'88'},{label:'A 영익 기여',data:cs.map(c=>R[c].osA),backgroundColor:P[0]},{label:'B 매출 기여',data:cs.map(c=>R[c].rsB),backgroundColor:P[1]+'88'},{label:'B 영익 기여',data:cs.map(c=>R[c].osB),backgroundColor:P[1]}]},options:{scales:{x:{},y:{ticks:{callback:v=>v+'%'}}}}});
  chart('cc2',{type:'bar',data:{labels:cs,datasets:[{label:'방법 A',data:cs.map(c=>R[c].psA),backgroundColor:P[0]},{label:'방법 B',data:cs.map(c=>R[c].psB),backgroundColor:P[1]}]},options:{scales:{x:{},y:{}}}})}
 $('#creset').onclick=()=>{S=JSON.parse(JSON.stringify(DEF));save();build()};build()};
