<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키다리 트래커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#191f28;--sub:#4e5968;--muted:#8b95a1;--line:#e9ebee;--chip:#f2f4f6;--chip-on:#fff;--up:#d6453d;--down:#3a6fd8;--accent:#3182f6;--hover:#f7f8fa;--head-bg:rgba(255,255,255,.86);--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);--grid:#eef0f3;
--c1:#3182f6;--c2:#f59e0b;--c3:#14a39a;--c4:#9b6bd3;--c5:#d6453d;--c6:#8b95a1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#191c22;--text:#e8eaed;--sub:#b0b8c1;--muted:#7d8590;--line:#2a2e36;--chip:#242832;--chip-on:#343a46;--up:#ff7a72;--down:#6f9bff;--accent:#4b93ff;--hover:#20242c;--head-bg:rgba(25,28,34,.86);--shadow:none;--grid:#242832;--c1:#4b93ff;--c2:#f5b342;--c3:#2fc4b8;--c4:#b48ae8;--c5:#ff7a72;--c6:#7d8590;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#191c22;--text:#e8eaed;--sub:#b0b8c1;--muted:#7d8590;--line:#2a2e36;--chip:#242832;--chip-on:#343a46;--up:#ff7a72;--down:#6f9bff;--accent:#4b93ff;--hover:#20242c;--head-bg:rgba(25,28,34,.86);--shadow:none;--grid:#242832;--c1:#4b93ff;--c2:#f5b342;--c3:#2fc4b8;--c4:#b48ae8;--c5:#ff7a72;--c6:#7d8590;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
a{color:inherit}button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:10px 32px;background:var(--head-bg);border-bottom:1px solid var(--line);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px)}
.brand{font-weight:800;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--up),#f59e0b 55%,var(--accent))}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:999px;white-space:nowrap;color:var(--sub);text-decoration:none;cursor:pointer;border:0;background:none;min-height:34px}
.tab:hover{background:var(--chip);color:var(--text)}.tab.on{background:var(--text);color:var(--card);font-weight:600}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer}
main{max-width:1240px;margin:0 auto;padding:18px 32px 40px}
.page{display:none}.page.on{display:block}
.page-head{margin:6px 2px 14px}.page-head h1{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.03em}.page-head p{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700}.cap{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi:hover{background:var(--hover)}.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em}.kpi .s{font-size:12px;color:var(--sub)}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;color:var(--sub);white-space:nowrap;min-height:32px}
.seg button.on{background:var(--chip-on);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dir{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer;min-height:34px;font-weight:600}
.lbl{font-size:12px;color:var(--muted);margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.wc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-decoration:none;color:inherit}
.wc:hover{border-color:var(--sub)}
.wc .im{position:relative;aspect-ratio:3/4;background:var(--chip);overflow:hidden}
.wc .im img{width:100%;height:100%;object-fit:cover;display:block}
.wc .rk{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:2px 8px}
.wc .ch{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px;background:rgba(255,255,255,.92);color:#191f28}
.wc .bd{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.wc .t{font-weight:700;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.wc .g{font-size:11px;color:var(--muted)}
.wc .m{display:grid;grid-template-columns:1fr auto;gap:1px 8px;font-size:12px}.wc .m span:nth-child(odd){color:var(--muted)}.wc .m b{text-align:right}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:var(--chip);margin-right:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--hover);border-top:0;cursor:pointer;user-select:none}
th.on{color:var(--accent)}th.on[data-dir=desc]::after{content:" ▼";font-size:10px}th.on[data-dir=asc]::after{content:" ▲";font-size:10px}
td.n,th.n{text-align:right}tbody tr:hover{background:var(--hover)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.ch-box{position:relative;height:280px}.ch-box.tall{height:340px}
.fin-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin-bottom:12px}
.fin-in label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:36px;width:100%}
.ct input{max-width:110px;text-align:right}td.d{color:var(--muted);font-size:12px;white-space:normal;min-width:180px}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.bad{background:rgba(214,69,61,.08);border:1px solid rgba(214,69,61,.25)}
ul.def{margin:0;padding-left:18px}ul.def li{margin:4px 0}
footer{max-width:1240px;margin:0 auto;padding:0 32px 40px;color:var(--muted);font-size:12px}
@media (max-width:720px){.top{padding:8px 12px;gap:10px;flex-wrap:wrap}.top-right{display:none}main{padding:12px 12px 32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}footer{padding:0 12px 32px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">키다리 트래커</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="top-right"><span id="stamp"></span><button id="theme" class="icon-btn" aria-label="다크 모드 전환" title="다크 모드 전환">◐</button></div>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const D=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const nf=(v,d=0)=>v==null||!isFinite(v)?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d});
const sg=(v,d=0)=>v==null||!isFinite(v)?'—':(v>0?'+':'')+nf(v,d);
const cls=v=>v==null?'':v>0?'up':v<0?'down':'';
const pct=(v,d=1)=>v==null||!isFinite(v)?'—':(v>0?'+':'')+nf(v,d)+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAL=()=>['--c1','--c2','--c3','--c4','--c5','--c6'].map(css);
const charts={};
function chart(id,cfg){if(charts[id])charts[id].destroy();const el=document.getElementById(id);if(!el)return;
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:css('--sub'),boxWidth:12}}}},cfg.options||{});
  const sc=cfg.options.scales||{};Object.values(sc).forEach(a=>{a.ticks=Object.assign({color:css('--muted')},a.ticks||{});a.grid=Object.assign({color:css('--grid')},a.grid||{})});
  charts[id]=new Chart(el,cfg)}

const PAGES=[['sum','요약'],['teaz','AI챗 티즈'],['kr','웹툰 KR'],['us','웹툰 US'],['jp','웹툰 JP'],['snack','숏드라마'],['apps','앱·국가'],['price','주가'],['fin','재무 12Q'],['mix','기여도 분해'],['calc','계산기'],['topco','탑코 비교'],['def','정의']];
const pages={};
function nav(){const t=$('#tabs');t.innerHTML=PAGES.map(([k,l])=>`<button class="tab" data-p="${k}">${l}</button>`).join('');
  t.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.p});
  const m=$('#main');m.innerHTML=PAGES.map(([k])=>`<section class="page" id="p-${k}"></section>`).join('')}
function show(){const k=(location.hash||'#sum').slice(1);const key=PAGES.some(p=>p[0]==k)?k:'sum';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p==key));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id=='p-'+key));
  if(!pages[key]){pages[key]=1;RENDER[key]()} window.scrollTo(0,0)}

/* ---------- 정렬 가능한 표 ---------- */
function table(el,cols,rows,init){let st=Object.assign({k:null,dir:'desc'},init||{});
  function draw(){let r=rows.slice();if(st.k){const c=cols.find(c=>c.k==st.k);r.sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;if(typeof x=='string')return st.dir=='asc'?x.localeCompare(y):y.localeCompare(x);return st.dir=='asc'?x-y:y-x})}
    el.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''} ${st.k==c.k?'on':''}" data-k="${c.k}" data-dir="${st.dir}">${c.l}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''} ${c.cl?c.cl(x[c.k]):''}">${c.f?c.f(x[c.k],x):esc(x[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.k==k)st.dir=st.dir=='desc'?'asc':'desc';else{st.k=k;st.dir='desc'}draw()})}
  draw()}

/* ---------- 카드 그리드 + 정렬 토글 ---------- */
function cardView(host,opt){const st={k:opt.sorts[0][0],dir:opt.sorts[0][2]||'desc',view:'card',q:''};
  host.innerHTML=`<div class="bar"><span class="lbl">정렬</span><div class="seg" data-r="sort">${opt.sorts.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('')}</div>
   <button class="dir" data-r="dir"></button><div class="seg" data-r="view"><button data-v="card">카드</button><button data-v="table">표</button></div>
   ${opt.filters?`<div class="seg" data-r="flt">${opt.filters.map(f=>`<button data-f="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}
   <span class="muted" data-r="cnt" style="margin-left:auto"></span></div><div data-r="body"></div>`;
  const q=s=>host.querySelector(`[data-r="${s}"]`);let flt=null;
  function draw(){let r=opt.rows.filter(x=>!flt||x.genre==flt||String(x.genre||'').includes(flt));
    r.sort((a,b)=>{let x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;return st.dir=='asc'?x-y:y-x});
    q('sort').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k==st.k));
    q('view').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==st.view));
    if(q('flt'))q('flt').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f==flt));
    q('dir').textContent=st.dir=='desc'?'내림차순 ▼':'오름차순 ▲';q('cnt').textContent=r.length+'개';
    const body=q('body');
    if(st.view=='card')body.innerHTML=`<div class="grid">${r.map(opt.card).join('')}</div>`;
    else table(body,opt.cols,r,{k:st.k,dir:st.dir})}
  q('sort').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(st.k==b.dataset.k)st.dir=st.dir=='desc'?'asc':'desc';else{st.k=b.dataset.k;st.dir=(opt.sorts.find(s=>s[0]==st.k)[2])||'desc'}draw()});
  q('dir').onclick=()=>{st.dir=st.dir=='desc'?'asc':'desc';draw()};
  q('view').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;draw()});
  if(q('flt'))q('flt').querySelectorAll('button').forEach(b=>b.onclick=()=>{flt=flt==b.dataset.f?null:b.dataset.f;draw()});
  draw()}
const img=(src,alt)=>src?`<img src="${esc(src)}" alt="${esc(alt)}" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:'';
const rkCh=v=>v==null?'':v>0?`<span class="ch" style="color:var(--up)">▲${v}</span>`:v<0?`<span class="ch" style="color:var(--down)">▼${-v}</span>`:`<span class="ch">–</span>`;

/* ---------- 페이지 ---------- */
const RENDER={};
const tz=D.teaz;
const annRev=(daily,won)=>daily*365*won/1e8;
RENDER.sum=()=>{const L=D.lezhin;const p=D.price;const n=p.c.length;const chg=(p.c[n-1]/p.c[n-2]-1)*100;
 $('#p-sum').innerHTML=`<div class="page-head"><h1>키다리스튜디오 대체데이터</h1><p>공개 웹·앱 데이터를 매일 08:40에 스냅샷해 매출군별로 잇습니다. 카드를 누르면 해당 탭으로 이동</p></div>
 <div class="kpis">
  <button class="kpi" data-go="price"><div class="l">주가 (${p.d[n-1].slice(4,6)}/${p.d[n-1].slice(6)})</div><div class="v">${nf(p.c[n-1])}원</div><div class="s ${cls(chg)}">${pct(chg)} · 시총 ${nf(p.c[n-1]*37071266/1e8)}억</div></button>
  <button class="kpi" data-go="teaz"><div class="l">티즈 누적 메시지</div><div class="v">${nf(tz.cum)}</div><div class="s">캐릭터 ${tz.chars.length}명 · 출시 ${tz.days}일</div></button>
  <button class="kpi" data-go="teaz"><div class="l">티즈 하루 메시지</div><div class="v">${nf(tz.basis)}</div><div class="s">${tz.basis_label}</div></button>
  <button class="kpi" data-go="calc"><div class="l">티즈 연환산 매출(상한)</div><div class="v">${nf(annRev(tz.basis,40),1)}~${nf(annRev(tz.basis,50),1)}억</div><div class="s">턴당 40~50원</div></button>
  <button class="kpi" data-go="kr"><div class="l">레진 KR Top100 조회 증분</div><div class="v">${sg(L.kr.dv)}</div><div class="s">24h 환산 · 2회차 수집부터</div></button>
  <button class="kpi" data-go="us"><div class="l">레진 US Top100 조회 증분</div><div class="v">${sg(L.us.dv)}</div><div class="s">24h 환산 · 2회차 수집부터</div></button>
  <button class="kpi" data-go="fin"><div class="l">3Q26 매출 / 영업이익</div><div class="v">595억 / 43억</div><div class="s">YoY +12.8% / +21.1%</div></button>
  <button class="kpi" data-go="topco"><div class="l">탑툰챗 하루 세션(11월)</div><div class="v">${nf(avgM(D.topco,'ALL',D.topco.dates[D.topco.dates.length-1].slice(0,7)))}</div><div class="s">9월 대비 ${pct((avgM(D.topco,'ALL',D.topco.dates[D.topco.dates.length-1].slice(0,7))/avgM(D.topco,'ALL','2026-09')-1)*100)}</div></button>
 </div>
 <div class="card note bad"><b>티즈 현재 속도로는</b> 연 ${nf(annRev(tz.basis,50),1)}억(상한) → 2027E Bear 30억에 ${nf(30/annRev(tz.basis,50),0)}배, 회사 Base 165억에 ${nf(165/annRev(tz.basis,50),0)}배 모자람. 성장 경로는 계산기 탭에서 탑코 케이스로 확인</div>
 <div class="card"><h2>매출군 → 트래킹 지표</h2>
 <div id="sum-map"></div></div>`;
 table($('#sum-map'),[{k:'line',l:'매출군'},{k:'country',l:'국가'},{k:'src',l:'트래킹 지표'},{k:'freq',l:'데이터'},{k:'tab',l:'탭'}],[
  {line:'AI챗(티즈)',country:'KR',src:'캐릭터별 누적 메시지·좋아요',freq:'일일 수치',tab:'AI챗 티즈'},
  {line:'웹툰 국내',country:'KR',src:'레진 실시간 Top100 조회·구독·순위',freq:'일일 수치',tab:'웹툰 KR'},
  {line:'웹툰 해외',country:'US',src:'레진 US Top100 조회·구독·순위',freq:'일일 수치',tab:'웹툰 US'},
  {line:'웹툰 해외',country:'JP',src:'레진 JP 일간 랭킹 Top100',freq:'순위만',tab:'웹툰 JP'},
  {line:'웹툰 해외',country:'TH·TW·JP·FR·DE',src:'봄툰TW·레진TH·벨툰JP·델리툰 앱 설치수·평점',freq:'일일 수치',tab:'앱·국가'},
  {line:'영상(숏드라마)',country:'KR·글로벌',src:'레진스낵 랭킹 30위·앱 설치수',freq:'순위·설치',tab:'숏드라마'},
  {line:'웹툰 국내(봄툰)',country:'KR',src:'앱 설치수만 (사이트 API는 robots 금지)',freq:'설치',tab:'앱·국가'},
  {line:'웹소설',country:'KR',src:'공개 경로 없음 (레진 0건, 봄툰 API 금지)',freq:'불가',tab:'—'},
  {line:'MD',country:'KR',src:'공개 경로 없음 (스마트스토어 robots 금지) → 분기 공시',freq:'불가',tab:'재무 12Q'}]);
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go)};

RENDER.teaz=()=>{const h=$('#p-teaz');

 chart('m3',{type:'bar',data:{labels:S.Q,datasets:segs.map((k,j)=>({label:k,data:S.op[k],backgroundColor:P[j]}))},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
 const A=S.annual;const ak=Object.keys(A.op);const at=A.Y.map((_,i)=>ak.reduce((a,k)=>a+A.op[k][i],0));
 chart('m4',{type:'bar',data:{labels:A.Y,datasets:ak.map((k,j)=>({label:k,data:A.op[k].map((v,i)=>v/at[i]*100),backgroundColor:P[j]}))},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>v+'%'}}}}});
 const Cc=S.cost;const ck=Object.keys(Cc.items);
 chart('m5',{type:'bar',data:{labels:Cc.cols,datasets:ck.map((k,j)=>({label:k,data:Cc.items[k].map((v,i)=>v/Cc.rev[i]*100),backgroundColor:P[j%6]}))},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>v+'%'}}}}});
 const views={rs:()=>segs.map(k=>Object.fromEntries([['부문',k],...S.Q.map((q,i)=>[q,S.rev[k][i]/tot[i]*100])])),
  gc:()=>segs.map(k=>Object.fromEntries([['부문',k],...yq.map((q,j)=>[q,gc(k)[j]])])).concat([Object.fromEntries([['부문','합계(매출 YoY)'],...yq.map((q,j)=>[q,(tot[j+4]/tot[j]-1)*100])])]),
  os:()=>segs.map(k=>Object.fromEntries([['부문',k],...S.Q.map((q,i)=>[q,otot[i]>0?S.op[k][i]/otot[i]*100:null])]))};
 const vq={rs:S.Q,gc:yq,os:S.Q};
 function dv(v){h.querySelectorAll('#mt button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));table($('#m6'),[{k:'부문',l:'부문'}].concat(vq[v].map(q=>({k:q,l:q,n:1,f:x=>v=='gc'?pct(x):nf(x,1)+'%',cl:v=='gc'?cls:null}))),views[v]())}
 h.querySelectorAll('#mt button').forEach(b=>b.onclick=()=>dv(b.dataset.v));dv('rs')};

function avgM(T,r,m){const v=T.dates.map((d,i)=>[d,T.regions[r].dS[i]]).filter(([d,x])=>d.startsWith(m)&&x!=null).map(x=>x[1]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}

RENDER.calc=()=>{const h=$('#p-calc');
 const DEF={daily:Math.round(tz.basis),core_rev:2636,core_op:218,kr_webtoon:1204,shares:35646926,per:12,tax:30,price:D.price.c[D.price.c.length-1],
  cases:{Bear:{mult:2,won:50,paid:30,recog:44,opm:-20,pen:3},Base:{mult:8.2,won:50,paid:60,recog:44,opm:18,pen:8},Bull:{mult:20,won:50,paid:100,recog:44,opm:25,pen:22}}};
 let S;try{S=JSON.parse(localStorage.getItem('kd_calc2'))}catch(e){} if(!S||!S.cases)S=JSON.parse(JSON.stringify(DEF));
 const ROWS=[['mult','A · 하루 메시지 배수(현재 대비)','탑코 1Q26→2Q26 챗 매출 ×8.2'],['won','A · 메시지당 과금(원)','탐방: 턴당 40→50원'],['paid','A · 유료 메시지 비중(%)','무료 턴 제외'],['recog','키다리 인식 비율(%)','작가 RS 후 파트너 50:50 → 100당 43~45'],['opm','티즈 영업이익률(%)','토큰비 파트너 부담. 회사 Base 30/165=18%'],['pen','B · 국내 웹툰 대비 챗 매출(%)','탑코 2Q26 22%']];
 h.innerHTML=`<div class="page-head"><h1>티즈 기여도 계산기 · 탑코 케이스</h1><p>숫자를 바꾸면 바로 다시 계산. 방법 A = 트래커 실측 하루 메시지에서 출발, 방법 B = 탑툰챗처럼 국내 웹툰 매출의 일정 비율까지 챗이 붙는 경우. 분모는 2027E 본업(티즈 제외)</p></div>
 <div class="card note"><b>탑코 벤치마크</b> · 챗 매출 1Q26 약 2.5억 → 2Q26 약 20.4억(×8.2, 국내 플랫폼의 22%) · 방문 MAU 3월 22만 → 9월 48만 · 공개 트래커 하루 세션 9월 ${nf(avgM(D.topco,'ALL','2026-09'))} → 11월 ${nf(avgM(D.topco,'ALL','2026-11'))}</div>
 <div class="card"><h2>공통 입력</h2><div class="fin-in">${[['core_rev','2027E 본업 매출(억)'],['core_op','2027E 본업 영업이익(억)'],['kr_webtoon','국내 웹툰 연매출(억, B)'],['daily','티즈 현재 하루 메시지'],['per','적용 PER(배)'],['tax','세율(%)'],['shares','유통주식(주)'],['price','현재 주가(원)']].map(([k,l])=>`<label>${l}<input type="number" step="any" data-g="${k}"></label>`).join('')}</div>
 <div class="tw"><table class="ct"><thead><tr><th>케이스 입력</th><th class="n">Bear</th><th class="n">Base</th><th class="n">Bull</th><th>근거</th></tr></thead><tbody id="cin"></tbody></table></div><button class="dir" id="creset" style="margin-top:8px">기본값으로</button></div>
 <div class="two"><div class="card"><h2>매출·영업이익 기여도</h2><div class="ch-box"><canvas id="cc1"></canvas></div></div><div class="card"><h2>주당가치 기여(원)</h2><div class="ch-box"><canvas id="cc2"></canvas></div></div></div>
 <div class="card"><h2>결과 (2027E, 억원)</h2><div class="tw"><table><thead><tr><th>항목</th><th class="n">Bear</th><th class="n">Base</th><th class="n">Bull</th></tr></thead><tbody id="cout"></tbody></table></div><p class="cap" id="cnote" style="margin-top:8px"></p></div>`;
 const save=()=>{try{localStorage.setItem('kd_calc2',JSON.stringify(S))}catch(e){}};
 function build(){h.querySelectorAll('[data-g]').forEach(el=>{el.value=S[el.dataset.g];el.oninput=()=>{S[el.dataset.g]=+el.value;save();calc()}});
  $('#cin').innerHTML=ROWS.map(([k,l,d])=>`<tr><td>${l}</td>${['Bear','Base','Bull'].map(c=>`<td class="n"><input type="number" step="any" data-c="${c}" data-k="${k}" value="${S.cases[c][k]}"></td>`).join('')}<td class="d">${d}</td></tr>`).join('');
  $('#cin').querySelectorAll('input').forEach(el=>el.oninput=()=>{S.cases[el.dataset.c][el.dataset.k]=+el.value;save();calc()});calc()}
 function calc(){const R={};['Bear','Base','Bull'].forEach(c=>{const p=S.cases[c],r={};
  r.mA=S.daily*p.mult;r.revA=r.mA*365*p.won*p.paid/100*p.recog/100/1e8;r.opA=r.revA*p.opm/100;r.rsA=r.revA/(S.core_rev+r.revA)*100;r.osA=r.opA/(S.core_op+r.opA)*100;r.psA=r.opA*(1-S.tax/100)*S.per*1e8/S.shares;
  r.revB=S.kr_webtoon*p.pen/100*p.recog/100;r.opB=r.revB*p.opm/100;r.rsB=r.revB/(S.core_rev+r.revB)*100;r.osB=r.opB/(S.core_op+r.opB)*100;r.psB=r.opB*(1-S.tax/100)*S.per*1e8/S.shares;
  r.needB=r.revB*1e8/(365*p.won*p.paid/100*p.recog/100);r.xB=r.needB/S.daily;R[c]=r});
  const rows=[['A · 2027 하루 메시지','mA',v=>nf(v)],['A · 티즈 매출','revA',v=>nf(v,1)],['A · 티즈 영업이익','opA',v=>nf(v,1)],['A · 매출 기여도','rsA',v=>nf(v,1)+'%'],['A · 영업이익 기여도','osA',v=>nf(v,1)+'%'],['A · 주당가치 기여(원)','psA',v=>nf(v)],
   ['B · 티즈 매출','revB',v=>nf(v,1)],['B · 티즈 영업이익','opB',v=>nf(v,1)],['B · 매출 기여도','rsB',v=>nf(v,1)+'%'],['B · 영업이익 기여도','osB',v=>nf(v,1)+'%'],['B · 주당가치 기여(원)','psB',v=>nf(v)],['B가 요구하는 하루 메시지','needB',v=>nf(v)],['B 요구치 ÷ 현재','xB',v=>nf(v,1)+'배']];
  $('#cout').innerHTML=rows.map(([l,k,f])=>`<tr><td>${l}</td>${['Bear','Base','Bull'].map(c=>`<td class="n">${f(R[c][k])}</td>`).join('')}</tr>`).join('');
  $('#cnote').textContent=`주당가치 기여 = 티즈 영업이익 × (1−세율) × PER ÷ 유통주식. 현재 주가 ${nf(S.price)}원 대비 Base A ${nf(R.Base.psA/S.price*100,1)}%, Base B ${nf(R.Base.psB/S.price*100,1)}%`;
  const P=PAL(),cs=['Bear','Base','Bull'];
  chart('cc1',{type:'bar',data:{labels:cs,datasets:[{label:'A 매출 기여',data:cs.map(c=>R[c].rsA),backgroundColor:P[0]+'88'},{label:'A 영익 기여',data:cs.map(c=>R[c].osA),backgroundColor:P[0]},{label:'B 매출 기여',data:cs.map(c=>R[c].rsB),backgroundColor:P[1]+'88'},{label:'B 영익 기여',data:cs.map(c=>R[c].osB),backgroundColor:P[1]}]},options:{scales:{x:{},y:{ticks:{callback:v=>v+'%'}}}}});
  chart('cc2',{type:'bar',data:{labels:cs,datasets:[{label:'방법 A',data:cs.map(c=>R[c].psA),backgroundColor:P[0]},{label:'방법 B',data:cs.map(c=>R[c].psB),backgroundColor:P[1]}]},options:{scales:{x:{},y:{}}}})}
 $('#creset').onclick=()=>{S=JSON.parse(JSON.stringify(DEF));save();build()};build()};
